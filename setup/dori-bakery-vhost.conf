# Add to XAMPP's active virtual hosts file. Adjust the project path if needed.
<VirtualHost *:80>
    ServerName dori-bakery.localhost
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs/Dori-Bakery-GitHub"

    <Directory "/Applications/XAMPP/xamppfiles/htdocs/Dori-Bakery-GitHub">
        DirectoryIndex index.php
        AllowOverride All
        Require local
    </Directory>
</VirtualHost>
